name: private-cli-release
on:
  push:
    branches: [main]
    paths: [apps/cli/package.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-cli-release
  cancel-in-progress: false
jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: useblacksmith/checkout@v1 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
      - id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, appendFileSync } from 'node:fs';
          const current = JSON.parse(readFileSync('apps/cli/package.json')).version;
          const before = process.env.BEFORE;
          const previous = before ? JSON.parse(execFileSync('git', ['show', `${before}:apps/cli/package.json`], {encoding: 'utf8'})).version : null;
          appendFileSync(process.env.GITHUB_OUTPUT, `changed=${current !== previous}\n`);
          JS
  checks:
    needs: version
    if: needs.version.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: useblacksmith/checkout@v1 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binary-*
          path: dist/releases
          merge-multiple: true
      - run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
