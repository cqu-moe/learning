name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-source-lock.mjs || true
      - run: node scripts/check-boundaries.mjs
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - run: pnpm test:e2e
      - run: node scripts/test-release.mjs
      - run: node scripts/test-release-target.mjs
      - name: Collect third-party licenses
        run: |
          mkdir -p dist
          pnpm licenses list --prod --json > dist/licenses.json
          node scripts/package-licenses.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-licenses
          path: dist/releases/LICENSES.txt*
          if-no-files-found: error
          retention-days: 7
  binaries:
    name: binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: blacksmith-4vcpu-ubuntu-2404 }
          - { target: linux-arm64, runner: blacksmith-4vcpu-ubuntu-2404-arm }
          - { target: macos-x64, runner: blacksmith-6vcpu-macos-15 }
          - { target: macos-arm64, runner: blacksmith-6vcpu-macos-15 }
          - { target: windows-x64, runner: blacksmith-4vcpu-windows-2025 }
    runs-on: ${{ matrix.runner }}
    env:
      LEARNING_BUILD_TARGET: ${{ matrix.target }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify Rosetta for the Intel macOS target
        if: matrix.target == 'macos-x64'
        run: arch -x86_64 /usr/bin/true
      - name: Verify runtime compatibility
        run: node scripts/test-bun-runtime.mjs
      - name: Compile official standalone executable
        run: node scripts/build-cli.mjs
        env:
          POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
      - name: Run standalone release executable
        run: node scripts/test-distribution.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 7
