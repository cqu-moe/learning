name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-source-lock.mjs || true
      - run: node scripts/check-boundaries.mjs
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - run: pnpm test:e2e
      - run: node scripts/test-release.mjs
      - name: Collect third-party licenses
        run: |
          mkdir -p dist
          pnpm licenses list --prod --json > dist/licenses.json
          node scripts/package-licenses.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-licenses
          path: dist/releases/LICENSES.txt*
          if-no-files-found: error
          retention-days: 7
  binaries:
    name: binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: macos-x64, runner: macos-15-intel }
          - { target: macos-arm64, runner: macos-15 }
          - { target: windows-x64, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify runtime compatibility
        run: node scripts/test-bun-runtime.mjs
      - name: Compile standalone executable
        run: node scripts/build-cli.mjs ${{ github.event_name == 'pull_request' && '--without-telemetry' || '' }}
        env:
          POSTHOG_PROJECT_TOKEN: ${{ github.event_name != 'pull_request' && vars.POSTHOG_PROJECT_TOKEN || '' }}
      - name: Run standalone executable
        run: node scripts/test-distribution.mjs ${{ github.event_name == 'pull_request' && '--without-telemetry' || '' }}
      - name: Verify native WSS proxy and denial controls
        run: node scripts/test-ws-proxy.mjs
      - name: Run standalone auth and catalog twice through local TLS providers
        run: node scripts/test-binary-catalog.mjs
      - name: Verify standalone journey failure controls
        run: node scripts/test-binary-catalog-controls.mjs
      - name: Prepare independent PDF reader
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python -m venv .tools/pdf-reader
            pdf_python="$PWD/.tools/pdf-reader/Scripts/python.exe"
          else
            python3 -m venv .tools/pdf-reader
            pdf_python="$PWD/.tools/pdf-reader/bin/python"
          fi
          "$pdf_python" -m pip install --disable-pip-version-check --no-cache-dir PyMuPDF==1.27.2.3
          node -e "const p = require('node:path'); console.log('LEARNING_PDF_PYTHON=' + p.resolve('.tools/pdf-reader', process.platform === 'win32' ? 'Scripts/python.exe' : 'bin/python'))" >> "$GITHUB_ENV"
      - name: Run standalone read-only exports and recovery twice
        run: node scripts/test-binary-exports.mjs
      - name: Verify export fault controls and cleanup
        run: node scripts/test-binary-exports-controls.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: catalog-evidence-${{ matrix.target }}
          path: dist/e2e/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 7
